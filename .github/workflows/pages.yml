# Builds the website and publishes it to GitHub Pages.
#
# The site is static: no server, no database, no API. Everything a visitor asks
# of it is arithmetic their own browser performs, which is the reason a plain
# file host is enough and the reason the site keeps working with the network
# cut once it has loaded.
#
# It builds against the package published to the registry rather than the source
# next door, so a green run here is also evidence that the released artifact
# works, the same standard the release notes hold every other port to.
#
# Actions are pinned to a commit rather than a tag: a tag can be moved to point
# at different code, a commit cannot.

name: Pages

on:
  push:
    branches: [main]
    # Everything the site is built from, which is not only `web/`.
    #
    # Two content collections read the repository itself: `/spec` renders
    # `SPEC.md`, and `/docs` renders each port's own README. That is the point
    # of them -- the site cannot fork from the source of truth -- but it means
    # editing either one changes the site while touching nothing under `web/`.
    #
    # This list left both out, so the specification could be amended, merged,
    # and never reach the page that publishes it. Found by editing `SPEC.md` and
    # waiting for a deploy that was never going to come. **This list mirrors
    # `web/src/content.config.ts`; a collection added there needs a line here**,
    # and `audit/deploys.py` fails the build if it does not get one.
    paths:
      - 'web/**'
      - 'design/**'
      - 'SPEC.md'
      - 'csharp/README.md'
      - 'java/README.md'
      - 'python/README.md'
      - 'typescript/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read the tree, mint the token Pages needs to accept a deployment, and nothing
# else. The build job below drops even the read permission it does not use.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that has started: a half
# applied deployment is a broken site, which is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci

      # A generated file somebody edited by hand is a fork of the design system
      # that nobody announced, and the next regeneration would silently undo it.
      - name: Check the generated tokens match their source
        run: npm run tokens:check

      # The icons and the manifest are drawn from the same tokens, so a colour
      # changed in one place and not regenerated is a check rather than a
      # discovery on somebody's home screen.
      - name: The icons match the tokens
        run: npm run icons:check

      # The landmark shards are built by the Landmarks workflow and published
      # as a release asset rather than committed. Eighty-two thousand files and
      # 260 MB would sit in every clone forever, for data that changes when
      # GeoNames does and not when this site does.
      #
      # A missing archive is a warning, not a failure. The site works without
      # it -- the reference list simply says it could not be loaded -- and
      # throwing away a whole deployment over it would be the worse trade.
      - name: Fetch the landmark shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download landmarks --pattern landmarks.tar.gz --dir .. --clobber; then
            mkdir -p landmarks
            tar -xzf ../landmarks.tar.gz -C landmarks
            echo "landmark shards: $(find landmarks -name '*.json' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No landmark archive published; the reference list will be empty. Run the Landmarks workflow to build one."
          fi

      # The name index rides in the same release. Two files rather than tens of
      # thousands, so unlike the shards these can live in `public/` and be
      # served without an integration of their own.
      - name: Fetch the name index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download landmarks --pattern names.tar.gz --dir .. --clobber; then
            mkdir -p public/names
            tar -xzf ../names.tar.gz -C public/names
            echo "name index: $(du -h public/names/names.txt | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No name index published; search by place name will say so. Run the Landmarks workflow to build one."
          fi

      - name: Build
        run: npx astro build

      # GitHub states one hard number about a published site: it "may be no
      # larger than 1 GB". Almost none of what goes over that line would be
      # this tree. The landmark archive is 82,000 shards and the name index is
      # one large file, both fetched above, and both grow when GeoNames does
      # rather than when anything here is edited. So the figure moves on its
      # own, between deployments that changed nothing, and the first notice of
      # it would otherwise be the day a deployment stopped working.
      #
      # Warn at four fifths, which is early enough to do something about and
      # late enough not to cry wolf. Fail only past the limit itself, where the
      # deployment was going to be refused anyway and the only thing left to
      # decide is whether the reason is legible.
      - name: The site has to fit in what Pages will publish
        run: |
          limit=1000000000
          bytes=$(du -sb dist | cut -f1)
          percent=$((bytes * 100 / limit))
          echo "site: $(du -sh dist | cut -f1), ${percent}% of the 1 GB Pages publishes" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/* | sort -rh | head -5 >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::The built site is ${bytes} bytes. Pages publishes no more than ${limit}, so this deployment would be refused. Cut the landmark archive down (web/scripts/build-landmarks.mjs decides what is kept) or shard the name index."
            exit 1
          fi
          if [ "$percent" -ge 80 ]; then
            echo "::warning::The built site is at ${percent}% of the 1 GB Pages publishes. Nothing is broken yet, and nothing in this tree has to change for it to break."
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Publishing from a workflow rather than a branch means the custom domain
      # is repository settings and nothing else: a CNAME file in the artifact is
      # ignored, so there is no file in this tree that can be checked instead.
      # What can be checked is the address the deployment actually answers on.
      #
      # A warning rather than a failure, because the site being reachable at the
      # wrong address is a worse thing to be told about by a red run that also
      # threw the deployment away.
      - name: The site should be answering on the custom domain
        env:
          SERVED: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: https://gridpointcode.com/
        run: |
          if [ "$SERVED" = "$EXPECTED" ]; then
            echo "Serving $SERVED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Deployed to $SERVED, expected $EXPECTED. Set the custom domain under Settings then Pages; it cannot be set from this repository."
            {
              echo "### Custom domain not in effect"
              echo
              echo "Served from \`$SERVED\`, expected \`$EXPECTED\`."
              echo
              echo "The domain is stored in the repository's Pages settings. A workflow"
              echo "deployment cannot set it, and a \`CNAME\` file in the artifact is ignored."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
