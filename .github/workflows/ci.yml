# Builds and tests all four ports on every push.
#
# Each port's suite reads the shared vectors in test_data/ and reproduces the
# digest of the generated sample pinned in test_data/v2_sample.csv. Four green
# ports therefore mean four byte-identical encoders, which is the one thing no
# amount of per-port testing could establish on its own.
#
# Actions are pinned to a commit rather than a tag: a tag can be moved to point
# at different code, a commit cannot.

name: CI

on:
  # Work reaches main through a pull request, so testing pull requests and main
  # itself covers every commit that lands, once each. Listening to pushes on
  # every branch as well would run the whole matrix twice for every commit on a
  # branch that has a pull request open.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  csharp:
    name: C# on ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0]
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Build the library
        run: dotnet build --configuration Release
      # The suite is run with dotnet run, not dotnet test; csharp/README.md
      # explains why.
      - name: Run the suite
        run: dotnet run --project gpc.tests/gpc.tests.csproj -f ${{ matrix.framework }}

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Signing belongs to a release, not to a build.
      - name: Build, test and package
        run: mvn -B -ntp verify -Dgpg.skip=true

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and the newest release. If the floor
        # ever stops working, this is where it shows.
        python: ['3.9', '3.14']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover --start-directory tests --top-level-directory . --verbose

  typescript:
    name: TypeScript on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install exactly what the lockfile says
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run the suite
        run: npm test

  vectors:
    name: Vectors regenerate identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Regenerate the corpus
        run: python test_data/generate.py
      # The generator is deterministic, so a diff here means the committed
      # vectors are not the ones the generator produces. Either encoding
      # behaviour changed, which is a breaking change, or a file was edited by
      # hand, which the ports would then be conforming to for no reason.
      - name: The committed corpus must be exactly what the generator produces
        run: git diff --exit-code -- test_data

  screening:
    name: The advisory list regenerates identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # The words live in screening/words.zip, encrypted so that they are not
      # plaintext in a public repository. The passphrase is in the script and in
      # screening/README.md; section 17.1 of the specification says why none of
      # this is a security measure.
      - name: Re-expand the advisory list
        run: python screening/expand.py
      # The four generated ScreenList files are the list as each port carries
      # it. A diff here means one of them was edited by hand, or the archive
      # changed and they were not rebuilt from it.
      - name: The committed lists must be exactly what the expander produces
        run: git diff --exit-code

  reference:
    name: The specification checks out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # reference/verify.py checks every exact claim SPEC.md makes, and holds
      # the transcription of Appendix A against the working implementation over
      # 200,000 coordinates. Nothing here ships, but it is what keeps the
      # document and the four ports describing the same format: if the spec
      # stops being implementable from, this is where it shows.
      - name: Check every claim the specification makes
        run: python reference/verify.py

  differential:
    name: The four ports agree case by case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # The drivers link against built output rather than source.
      - name: Build the TypeScript package
        run: npm ci && npm run build
        working-directory: typescript
      - name: Compile the Java classes
        run: mvn -B -ntp -q compile
        working-directory: java
      # The shared vectors pin what the ports were already known to agree on.
      # This pins the rest: one battery of awkward inputs, compiled against all
      # four, diffed. It does not assert what any answer is, only that the four
      # produce the same one. See conformance/README.md.
      - name: The four ports must agree case by case
        run: python conformance/compare.py

      # A fuzzer nobody has watched fail is a fuzzer nobody knows works, so its
      # own judgement is tested first and separately. These need no toolchains
      # and take a fraction of a second.
      - name: The fuzzer's checks must themselves work
        run: python -m unittest discover --start-directory conformance --top-level-directory conformance

      # Generated cases rather than written ones, on a fresh seed every run, so
      # this reaches somewhere new each time rather than re-asking what the
      # battery already pins. The seed is printed: a failure here is reproduced
      # exactly by passing it back.
      #
      # It rides on this job because the job already has all four toolchains
      # built and ready, which is the expensive part. The fuzzing itself is
      # seconds.
      - name: Generated cases must not divide the ports either
        run: python conformance/fuzz.py --cases 4000 --rounds 3

  throughput:
    name: Throughput holds up in all four ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build the TypeScript package
        run: npm ci && npm run build
        working-directory: typescript
      - name: Compile the Java classes
        run: mvn -B -ntp -q compile
        working-directory: java

      # A shared runner is a bad clock, so nothing here compares one run's
      # absolute figures with another's. Every leg also times a fixed
      # arithmetic loop the library has nothing to do with, and the check reads
      # the ratio -- a runner having a slow morning is slow at both.
      #
      # The band is wide on purpose. This is not here to notice fifteen percent;
      # it is here to notice a regular expression compiled inside a loop, which
      # is five times and would otherwise ship. The table goes to the job
      # summary either way, which is where drift is meant to be read.
      - name: The four ports must not have got slower
        run: python bench/bench.py --check

  documentation:
    name: The documentation holds together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # A checker nobody has watched fail is a checker nobody knows works, and
      # one that silently passes everything looks exactly like a clean
      # repository. Every check is given a document that breaks it first.
      - name: The checks themselves work
        run: python -m unittest discover --start-directory audit --top-level-directory audit

      # Cross-references, relative links, table separators, and three dashes
      # under a paragraph -- which is a heading underline, not a rule, and had
      # silently turned the last line of three paragraphs in SPEC.md into a
      # heading before anyone noticed.
      - name: Every link resolves and every table holds
        run: python audit/markdown.py

      # Documentation rots quietly: a renamed method or a value that drifted by
      # a digit shows up in no test suite, because nothing executes prose. This
      # executes it, and checks what it claims.
      - name: Every documented example runs and says what it does
        run: python audit/examples.py

      # `/spec` renders SPEC.md and `/docs` renders each port's README, so the
      # site is built from files outside `web/`. The Pages workflow only runs on
      # a list of paths, and that list did not include them: the specification
      # could be amended, merged, and never reach the page that publishes it,
      # with every check green.
      - name: Everything the site renders can deploy it
        run: python audit/deploys.py

  website:
    name: The website builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exactly what the lockfile says
        run: npm ci
      # design/tokens.json is the only place a colour, a step of the spacing
      # scale or a size of type is decided. The stylesheet the site imports and
      # the resource files an Android app would read are both generated from it,
      # so an edit to either of those is a fork of the design system that would
      # be silently undone the next time the generator ran.
      - name: The generated design tokens must match their source
        run: npm run tokens:check

      # The icons and the manifest are drawn from the same tokens, so a colour
      # changed in one place and not regenerated is a check rather than a
      # discovery on somebody's home screen.
      - name: The icons match the tokens
        run: npm run icons:check

      # The index is sorted by one `fold` and searched by another, in two
      # languages. A disagreement is not a wrong answer, it is a binary search
      # landing in the wrong part of a quarter-gigabyte file and reporting that
      # a place does not exist.
      - name: Both halves of the search fold a name the same way
        run: node scripts/test-search.mjs

      # Twenty-four places are called Toronto and the first index put Ontario
      # nineteenth, behind five rows a reader could not tell apart. Nothing
      # failed: every row was right and the answer was wrong.
      - name: The name index answers with the place that was meant
        run: node scripts/test-names.mjs
      # The site imports the package from the registry, not the source next
      # door. So this job is also a standing test of the published artifact: if
      # a release ever shipped a broken build or dropped an operation the site
      # calls, the failure surfaces here rather than in somebody else's project.
      - name: Build against the published package
        run: npx astro build
      - name: Type-check the components
        run: npx astro check

  conformance:
    name: All four ports agree
    runs-on: ubuntu-latest
    needs: [csharp, java, python, typescript, vectors, screening, reference, differential]
    if: always()
    steps:
      - name: Require every port to have passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A port failed, so the four implementations are not known to agree."
          exit 1
      - name: Record what was proven
        run: |
          {
            echo "### Cross-port conformance"
            echo
            echo "C#, Java, Python and TypeScript each encoded the shared 100,000 point"
            echo "sample and reproduced the SHA-256 pinned in \`test_data/v2_sample.csv\`."
            echo "All four ports emit byte-identical codes."
            echo
            echo "The four also agree case by case on the differential battery in"
            echo "\`conformance/\`, which covers the awkward inputs no vector records."
          } >> "$GITHUB_STEP_SUMMARY"
