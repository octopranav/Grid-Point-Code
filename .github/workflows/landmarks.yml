# Builds the landmark shards from a GeoNames dump and publishes them as a
# release asset.
#
# These are the places a short form can be anchored to. Five characters resolve
# only against a reference near the point, so the playground has to be able to
# say which references are near enough -- and outside that range recovery does
# not fail, it returns somewhere else entirely.
#
# It is a job of its own because it downloads 400 MB and spends five minutes on
# it, which is not a thing to do on every push to a stylesheet. It runs once a
# week, since GeoNames rewrites its dump every day and a week of edits is worth
# having, and by hand whenever the data is wanted sooner. A run that publishes
# starts the Pages workflow, so the site and the packs move together.
#
# Nobody reads a scheduled run before it publishes, so the run reads itself:
# the new data is measured against what is published and refused if it shrank
# (see "Compare with what is published"). Shrinking on purpose stays possible,
# by hand, as a decision rather than a side effect.
#
# GitHub stops the schedule of a public repository after 60 days with no
# activity in it, and says so by email first. Turn it back on under Actions,
# Landmarks.
#
# Actions are pinned to a commit rather than a tag: a tag can be moved to point
# at different code, a commit cannot. The release itself is made with `gh`,
# which ships on the runner, so publishing adds no third party to the chain.

name: Landmarks

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Cell level to shard on'
        required: false
        default: '4'
      slices:
        description: 'Passes over the dump; more passes, less memory'
        required: false
        default: '8'
      shrink:
        description: 'Publish even if the data shrank'
        type: boolean
        required: false
        default: false
  schedule:
    # Mondays, two hours after GeoNames writes the day's dump (about 03:35 UTC),
    # and clear of the hour, when scheduled runs queue longest.
    - cron: '43 5 * * 1'

# Enough to write the release, and nothing else.
permissions:
  contents: write

concurrency:
  group: landmarks
  cancel-in-progress: false

jobs:

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci
        working-directory: web

      # The dump, and the two tables that turn its codes into words. Canadian
      # provinces arrive as FIPS numerals, so `Ontario` has to be looked up --
      # and printing `ON, CA` instead would invite a reader to hear Ontario,
      # California, which is a real place 3,700 km from the other one.
      - name: Fetch the GeoNames dump
        run: |
          mkdir -p geonames
          cd geonames
          for f in allCountries.zip admin1CodesASCII.txt countryInfo.txt; do
            curl -fsSL --retry 3 --retry-delay 5 -O "https://download.geonames.org/export/dump/$f"
          done
          unzip -q allCountries.zip
          rm allCountries.zip
          echo "rows: $(wc -l < allCountries.txt)"

      # Slices keep the peak under about 2 GB. Without them this needs more
      # than 4 and is one runner change away from failing. A scheduled run has
      # no inputs, so the defaults are said twice, here and above.
      - name: Build the shards
        env:
          LEVEL: ${{ inputs.level || '4' }}
          SLICES: ${{ inputs.slices || '8' }}
        run: |
          node scripts/build-landmarks.mjs \
            --geonames ../geonames \
            --out landmarks \
            --level "$LEVEL" \
            --slices "$SLICES" | tee ../report.txt
        working-directory: web

      # The other direction. The archive answers "what is near this point"; this
      # answers "where is the place called this", which is the first thing
      # anybody reaches for. Built from the same dump in the same job, because
      # the download is the expensive part and it is already paid for. The
      # packs are the same lines a file a country, for the Android app to keep
      # and search with no network.
      - name: Build the name index
        run: |
          node scripts/build-names.mjs \
            --geonames ../geonames \
            --out names \
            --packs packs | tee -a ../report.txt
        working-directory: web

      # Every pack the list names has to be a file the upload below will find,
      # or the app offers a country it cannot fetch. A glob passes over a name
      # that begins with a dot, and a pack for places with no country was once
      # called `.txt.gz`. Checked before anything is published.
      - name: Pack them
        run: |
          node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync("web/packs/packs.json", "utf8"));
            const missing = Object.keys(list.countries)
              .filter((cc) => !/^[A-Z]{2}$/.test(cc) || !fs.existsSync(`web/packs/${cc}.txt.gz`));
            if (missing.length) {
              console.log(`::error::packs.json names packs the upload would not find: ${JSON.stringify(missing)}`);
              process.exit(1);
            }
          '
          tar -czf landmarks.tar.gz -C web/landmarks .
          tar -czf names.tar.gz -C web/names .
          ls -l landmarks.tar.gz names.tar.gz

      # A dump cut short, or a change in its format, builds without an error
      # and would publish a world with most of its places missing, to the site
      # and to every phone that keeps a pack. So the new data is measured
      # against what is published now: the landmarks, their shards, the names
      # packed for the app, and every country with a pack. A week of GeoNames
      # edits moves these by thousands in millions; a fall of one in twenty is
      # not an edit, and nor is a country with no pack. Failing here publishes
      # nothing, and the release stays as it was.
      - name: Compare with what is published
        if: ${{ !inputs.shrink }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir before
          if ! gh release download place-packs --pattern packs.json --dir before; then
            echo 'Nothing published yet, so nothing to compare with.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release download landmarks --pattern landmarks.tar.gz --output - \
            | tar -xzO ./manifest.json > before/manifest.json
          node -e '
            const fs = require("fs");
            const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
            const lines = (packs) => Object.values(packs.countries).reduce((sum, c) => sum + c.lines, 0);
            const was = { archive: read("before/manifest.json"), packs: read("before/packs.json") };
            const now = { archive: read("web/landmarks/manifest.json"), packs: read("web/packs/packs.json") };
            const measured = [
              ["landmarks", was.archive.landmarks, now.archive.landmarks],
              ["shards", was.archive.shards, now.archive.shards],
              ["packed names", lines(was.packs), lines(now.packs)],
              ["country packs", Object.keys(was.packs.countries).length, Object.keys(now.packs.countries).length],
            ];
            const summary = ["| | published | built | change |", "| --- | ---: | ---: | ---: |"];
            const refused = [];
            for (const [what, before, after] of measured) {
              const change = ((after - before) / before) * 100;
              summary.push(`| ${what} | ${before.toLocaleString("en")} | ${after.toLocaleString("en")} | ${change.toFixed(2)}% |`);
              if (after < before * 0.95) refused.push(`${what} fell from ${before} to ${after}`);
            }
            const gone = Object.keys(was.packs.countries).filter((cc) => !(cc in now.packs.countries));
            if (gone.length) refused.push(`no pack any more for ${gone.join(", ")}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n\n");
            console.log(summary.join("\n"));
            for (const reason of refused) {
              console.log(`::error::${reason}. Nothing was published. If the data really did shrink, run this by hand with "Publish even if the data shrank".`);
            }
            if (refused.length) process.exit(1);
          '

      # One moving tag rather than a dated one, so the Pages build has a fixed
      # name to ask for. Asking for `latest` would hand it whichever release is
      # newest, and the ports publish releases here too.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view landmarks >/dev/null 2>&1 || gh release create landmarks \
            --title 'Landmark shards' \
            --notes 'Built by the Landmarks workflow.'

          gh release upload landmarks landmarks.tar.gz names.tar.gz --clobber

          {
            echo 'Places a short form can be anchored to, sharded by cell --'
            echo 'and a sorted index of their names, read by byte range.'
            echo
            echo 'Built by the Landmarks workflow from a GeoNames dump.'
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo 'Data from [GeoNames](https://www.geonames.org), CC BY 4.0.'
          } > notes.md
          gh release edit landmarks --notes-file notes.md

          # The packs are their own release, since the app asks for them by name
          # and one at a time. The manifest goes last, so it never names a pack
          # that is not there yet.
          gh release view place-packs >/dev/null 2>&1 || gh release create place-packs \
            --title 'Place-name packs' \
            --notes 'Built by the Landmarks workflow.'
          gh release upload place-packs web/packs/*.txt.gz --clobber
          gh release upload place-packs web/packs/packs.json --clobber
          {
            echo 'The name index a file a country, for searching with no network.'
            echo 'Each is gzip-compressed and holds the same lines as the index, in'
            echo 'its order; packs.json names every country, its size, and the'
            echo 'regions the lines point into.'
            echo
            echo 'Built by the Landmarks workflow from a GeoNames dump.'
            echo
            echo 'Data from [GeoNames](https://www.geonames.org), CC BY 4.0.'
          } > packs-notes.md
          gh release edit place-packs --notes-file packs-notes.md

          cat report.txt >> "$GITHUB_STEP_SUMMARY"
