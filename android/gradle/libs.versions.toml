[versions]
agp = "9.4.1"
kotlin = "2.4.20"
gridpointcode = "2.0.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
maplibre = "13.6.1"
zxing = "3.5.4"
playServicesWearable = "20.0.1"
wearCompose = "1.7.0"
fragment = "1.8.9"
wearTiles = "1.6.2"
protolayout = "1.4.2"
wearComplications = "1.3.0"
concurrentFutures = "1.3.0"
carApp = "1.7.0"
coroutines = "1.9.0"

[libraries]
# The format itself, installed from Maven Central like anybody else installs it.
gridpointcode = { module = "ca.pranavpatel.algo:gridpointcode", version.ref = "gridpointcode" }

# The basemap. The same renderer family as the website, drawing the same styles.
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }

# The QR code for a place's link: the standard encoder, of which the release keeps only the encoding.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# The Wear Data Layer, which carries saved places between the phone and the watch.
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

# The watch's screens.
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
# Play services asks for fragment 1.1.0, older than the permission request the watch
# makes can rely on. The phone reaches a current one through its other libraries;
# the watch has none of them, so it names the same version itself.
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

# The watch's tile, laid out by the system from a description, and its complication.
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "protolayout" }
wear-protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
wear-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearComplications" }
# The tile answers with a future; the tile library resolves this one, and the tile names it to build one.
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }

# The car's screens, drawn by the car from templates: Android Auto from the phone, and
# Android Automotive in the car itself.
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }
car-app-automotive = { module = "androidx.car.app:app-automotive", version.ref = "carApp" }
# A car screen's work runs while it shows and stops when it does not.
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# The saved places reach the car screens as a flow, so an app handing them over needs its type.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
