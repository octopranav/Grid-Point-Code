[versions]
agp = "9.4.1"
kotlin = "2.4.20"
gridpointcode = "2.0.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
maplibre = "13.6.1"
zxing = "3.5.4"
playServicesWearable = "20.0.1"
wearCompose = "1.7.0"
fragment = "1.8.9"
wearTiles = "1.6.2"
protolayout = "1.4.2"
wearComplications = "1.3.0"
concurrentFutures = "1.3.0"
carApp = "1.7.0"
coroutines = "1.9.0"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
androidxTestOrchestrator = "1.6.1"
androidxTestServices = "1.6.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
robolectric = "4.17"
roborazzi = "1.76.0"
leakcanary = "2.14"

[libraries]
# The format itself, installed from Maven Central like anybody else installs it.
gridpointcode = { module = "ca.pranavpatel.algo:gridpointcode", version.ref = "gridpointcode" }

# The basemap. The same renderer family as the website, drawing the same styles.
# Drawn with OpenGL ES, MapLibre's opt-in package since its default became
# Vulkan in 13.0: the Vulkan one stops the app where it finds no GPU it can use,
# with nothing to fall back on, and OpenGL ES is on every phone the app runs on.
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }

# The QR code for a place's link: the standard encoder, of which the release keeps only the encoding.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# The Wear Data Layer, which carries saved places between the phone and the watch.
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

# The watch's screens.
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
# Play services asks for fragment 1.1.0, older than the permission request the watch
# makes can rely on. The phone reaches a current one through its other libraries;
# the watch has none of them, so it names the same version itself.
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

# The watch's tile, laid out by the system from a description, and its complication.
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "protolayout" }
wear-protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
wear-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearComplications" }
# The tile answers with a future; the tile library resolves this one, and the tile names it to build one.
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }

# The car's screens, drawn by the car from templates: Android Auto from the phone, and
# Android Automotive in the car itself.
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }
car-app-automotive = { module = "androidx.car.app:app-automotive", version.ref = "carApp" }
# A car screen's work runs while it shows and stops when it does not.
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# The saved places reach the car screens as a flow, so an app handing them over needs its type.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# Tests on a device: the app itself, driven as a reader drives it, on an emulator in CI.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
# Each test in a fresh process with the app's data cleared, so one leaves nothing for the next.
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-test-services = { module = "androidx.test.services:test-services", version.ref = "androidxTestServices" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso" }
# Google's Accessibility Test Framework, which the Compose test rule runs on every action.
espresso-accessibility = { module = "androidx.test.espresso:espresso-accessibility", version.ref = "espresso" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# The screens drawn on the computer, for the design's reference images: Robolectric
# runs the app's own code on a desktop JVM, drawing with Android's real graphics
# stack, and Roborazzi records each screen and compares it with the one kept.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

# Leak detection in debug builds, and after every device test that passes.
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
leakcanary-android-instrumentation = { module = "com.squareup.leakcanary:leakcanary-android-instrumentation", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
