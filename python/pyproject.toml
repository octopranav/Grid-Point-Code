[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "gridpointcode_algo_pranavpatel_ca"
version = "2.0.0"
authors = [
  { name="Pranavkumar Patel", email="contact@pranavpatel.ca" },
]
description = "Grid Point Code (GPC) names any location on Earth with a compact ten-character alphanumeric code. Encoding and decoding run offline, with no network and no lookup table, and two codes share their first k characters exactly when the two points lie in the same level-k cell, so a shared prefix is a shared region."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "encoding",
    "offline",
    "geocoding",
    "mapping",
    "location",
    "geospatial",
    "address",
    "gis",
    "decoding",
    "latitude",
    "longitude",
    "coordinates",
    "unique-identifier",
    "precision",
    "gpc",
    "geographic",
    "grid-point-code",
    "global-code",
    "geocode",
    "hierarchical",
    "spatial-index",
    "prefix-search",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/octopranav/Grid-Point-Code"
"Repository" = "https://github.com/octopranav/Grid-Point-Code"
"Documentation" = "https://github.com/octopranav/Grid-Point-Code/blob/main/SPEC.md"
"Changelog" = "https://github.com/octopranav/Grid-Point-Code/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/octopranav/Grid-Point-Code/issues"

# The suite reads the shared conformance vectors, which live above this
# directory because all four ports read the same ones. Without them the sdist
# ships a test suite that cannot run, which is what a distribution packager
# building from source finds first. The wheel carries neither tests nor vectors.
[tool.hatch.build.targets.sdist.force-include]
"../test_data" = "test_data"
